name: Deploy Vojtiech Havel Codex
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-codex
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check website files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s pages.js
          test -s styles.css
          test -s assets/cover.webp
          test -s assets/crest.webp
          test -s assets/paper.webp
          test -s assets/study.webp
          test -s assets/story-scenes.webp
      - name: Validate chapters, JavaScript and illustrations
        shell: bash
        run: |
          set -euo pipefail
          node --check pages.js
          node --check app.js
          node <<'JS'
          const fs=require('node:fs');
          global.window={};
          require('./pages.js');
          const p=window.CODEX_PAGES, c=window.CODEX_CHAPTERS;
          if(!Array.isArray(p) || p.length<20 || p.length%2)throw Error('Invalid folio count');
          if(!Array.isArray(c) || c.length<7)throw Error('Missing table of contents');
          for(const [i,item] of p.entries()){
            if(item.type==='illustration') { const src=item.scene?'assets/story-scenes.webp':item.src; if(!src || !fs.existsSync(src)) throw Error('Illustration missing on folio '+(i+1)+': '+src); }
          }
          console.log('Verified',p.length,'folios,',c.length,'chapters');
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
