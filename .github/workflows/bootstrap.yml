name: Deploy Vojtiech Havel Codex
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-codex
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check website files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s pages.js
          test -s styles.css
          test -s assets/cover.webp
          test -s assets/crest.webp
          test -s assets/paper.webp
          test -s assets/study.webp
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
